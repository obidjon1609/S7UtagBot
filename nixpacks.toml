[phases.build]
cmds = ["curl -sS https://bootstrap.pypa.io/get-pip.py | python3 && python3 -m pip install -r requirements.txt"]

[phases.start]
cmd = "python3 pro.tag.10.py"

[phases.install]
cmds = ["apt-get update && apt-get install -y --no-install-recommends python3-dev curl"]

[variables]
PORT = "8080"
